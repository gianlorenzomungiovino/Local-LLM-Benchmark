[project]
name = "llm-client-bench"
version = "0.1.0"
description = "Benchmark runner for llama.cpp HTTP API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
bench = "run:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pytest_env]
# Prevent the real file logger from writing during tests
LLM_CLIENT_TEST_MODE = "1"
